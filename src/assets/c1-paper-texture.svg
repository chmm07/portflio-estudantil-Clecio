<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="18" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.075" />
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" fill="#f6f0e6" opacity="0.16" />
  <rect width="180" height="180" filter="url(#paperNoise)" opacity="0.5" />
</svg>
